# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"
reviews:
  profile: "chill"          # or "assertive"
  path_instructions:
    - path: "**/*.ts"
      instructions: |
        - any型の使用を指摘すること
        - エラーハンドリングの漏れを確認すること
    - path: "src/api/**"
      instructions: |
        - 認証・認可チェックの有無を確認すること
        - 入力値バリデーションを確認すること
  auto_review:
    enabled: true
